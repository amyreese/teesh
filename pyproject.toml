[build-system]
requires = ["flit_core >=4,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "teesh"
readme = "README.md"
authors = [
    {name="Amethyst Reese", email="amethyst@n7.gg"},
]
license = "MIT"
dynamic = ["version", "description"]
requires-python = ">=3.10"
dependencies = []


[dependency-groups]
dev = [
    "attribution>=1.8",
    "black>=26.5.1",
    "build>=1.5.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
    "ufmt>=2.9.1",
    "unittest-ft>=0.5",
]

[project.urls]
Home = "https://github.com/amyreese/teesh"

[tool.flit.sdist]
exclude = [
    ".github/",
]

[tool.attribution]
name = "teesh"
package = "teesh"
version_file = true
ignored_authors = ["dependabot[bot]"]
signed_tags = true

[tool.mypy]
strict = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
